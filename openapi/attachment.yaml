paths:
  /attachment/url/{id}:
    get:
      tags: [Attachment]
      summary: 获取附件预览签名URL
      description: 返回 MinIO 预签名 URL，用于在线预览附件
      operationId: getAttachmentUrl
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 附件ID
      responses:
        "200":
          description: 签名URL字符串
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: string
                        description: MinIO 预签名预览URL

  /attachment/download-url/{id}:
    get:
      tags: [Attachment]
      summary: 获取附件下载签名URL
      description: 返回 MinIO 预签名下载 URL（带 Content-Disposition: attachment）
      operationId: getAttachmentDownloadUrl
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 附件ID
      responses:
        "200":
          description: 签名下载URL字符串
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: string
                        description: MinIO 预签名下载URL

components:
  schemas:
    AttachmentVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 附件ID
        fileName:
          type: string
          description: 文件名
        fileSize:
          type: integer
          format: int64
          description: 文件大小（字节）
        fileType:
          type: string
          description: 文件类型
        url:
          type: string
          description: 预览地址
        relatedType:
          type: string
          enum: [TOPIC, REPLY]
          description: 关联类型
        relatedId:
          type: integer
          format: int64
          description: 关联业务ID
        createTime:
          type: string
          format: date-time
          description: 创建时间
