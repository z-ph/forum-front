paths:
  /attachment/view/{id}:
    get:
      tags: [Attachment]
      summary: 附件在线预览（图片）
      description: 仅支持图片类型附件（IMAGE），直接返回图片二进制流
      operationId: viewAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 附件ID
      responses:
        "200":
          description: 图片二进制流
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
        "500":
          description: 文件输出失败

  /attachment/download/{id}:
    get:
      tags: [Attachment]
      summary: 下载附件
      description: 下载附件（图片和文件均可），Content-Disposition 为 attachment
      operationId: downloadAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 附件ID
      responses:
        "200":
          description: 附件文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
        "500":
          description: 文件输出失败

components:
  schemas:
    AttachmentVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 附件ID
        fileName:
          type: string
          description: 文件名
        fileSize:
          type: integer
          format: int64
          description: 文件大小（字节）
        fileType:
          type: string
          enum: [IMAGE, FILE]
          description: 文件类型
        url:
          type: string
          description: 图片预览地址（直接访问磁盘文件的静态资源地址）
        downloadUrl:
          type: string
          description: 下载地址（通过接口下载）
        relatedType:
          type: string
          enum: [TOPIC, REPLY]
          description: 关联类型
        relatedId:
          type: integer
          format: int64
          description: 关联业务ID
        createTime:
          type: string
          format: date-time
          description: 创建时间
