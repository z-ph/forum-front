openapi: "3.0.3"
info:
  title: Forum Backend API
  description: |
    论坛后端 REST API 接口文档

     **后端版本**: commit `26f018c` (master)
     日期: 2026-06-12

    ## 通用说明
    - 所有响应统一包裹在 `Result<T>` 中: `{ code: 1, msg: "success", data: T }`
    - `code=1` 表示成功，其他值表示错误
    - 分页接口返回 `Page<T>`: `{ records: T[], total, size, current, pages }`
    - 需要认证的接口在 `Authorization` header 中传入 `Bearer <jwt_token>`
    - 日期格式: `yyyy-MM-dd HH:mm:ss` (LocalDateTime), `yyyy-MM-dd` (LocalDate)
  version: "26f018c"
  contact:
    name: Backend Team

security:
  - bearerAuth: []

paths:
  # ==================== User ====================
  /user/register:
    $ref: "./openapi/user.yaml#/paths/~1user~1register"
  /user/login:
    $ref: "./openapi/user.yaml#/paths/~1user~1login"
  /user/me:
    $ref: "./openapi/user.yaml#/paths/~1user~1me"
  /user/update:
    $ref: "./openapi/user.yaml#/paths/~1user~1update"
  /user/{id}/status:
    $ref: "./openapi/user.yaml#/paths/~1user~1{id}~1status"
  /user/page:
    $ref: "./openapi/user.yaml#/paths/~1user~1page"

  # ==================== Topic ====================
  /topic:
    $ref: "./openapi/topic.yaml#/paths/~1topic"
  /topic/{id}:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1{id}"
  /topic/selectAll:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1selectAll"
  /topic/page:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1page"
  /topic/detail/{id}:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1detail~1{id}"
  /topic/{id}/status:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1{id}~1status"
  /topic/my:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1my"
  /topic/admin/page:
    $ref: "./openapi/topic.yaml#/paths/~1topic~1admin~1page"

  # ==================== Tag ====================
  /tag:
    $ref: "./openapi/tag.yaml#/paths/~1tag"
  /tag/{id}:
    $ref: "./openapi/tag.yaml#/paths/~1tag~1{id}"
  /tag/selectAll:
    $ref: "./openapi/tag.yaml#/paths/~1tag~1selectAll"
  /tag/search:
    $ref: "./openapi/tag.yaml#/paths/~1tag~1search"

  # ==================== Reply ====================
  /reply:
    $ref: "./openapi/reply.yaml#/paths/~1reply"
  /reply/{id}:
    $ref: "./openapi/reply.yaml#/paths/~1reply~1{id}"
  /reply/top/page:
    $ref: "./openapi/reply.yaml#/paths/~1reply~1top~1page"
  /reply/child/page:
    $ref: "./openapi/reply.yaml#/paths/~1reply~1child~1page"
  /reply/my:
    $ref: "./openapi/reply.yaml#/paths/~1reply~1my"

  # ==================== Category ====================
  /category:
    $ref: "./openapi/category.yaml#/paths/~1category"
  /category/{id}:
    $ref: "./openapi/category.yaml#/paths/~1category~1{id}"
  /category/parents:
    $ref: "./openapi/category.yaml#/paths/~1category~1parents"
  /category/children/{parentId}:
    $ref: "./openapi/category.yaml#/paths/~1category~1children~1{parentId}"
  /category/search:
    $ref: "./openapi/category.yaml#/paths/~1category~1search"
  /category/selectAll:
    $ref: "./openapi/category.yaml#/paths/~1category~1selectAll"

  # ==================== Attachment ====================
  /attachment/url/{id}:
    $ref: "./openapi/attachment.yaml#/paths/~1attachment~1url~1{id}"
  /attachment/download-url/{id}:
    $ref: "./openapi/attachment.yaml#/paths/~1attachment~1download-url~1{id}"

  # ==================== Health ====================
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "./openapi/common.yaml#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: string
                        example: "ok"

components:
  securitySchemes:
    $ref: "./openapi/common.yaml#/components/securitySchemes"
  schemas:
    ApiResponse:
      $ref: "./openapi/common.yaml#/components/schemas/ApiResponse"
    PageInfo:
      $ref: "./openapi/common.yaml#/components/schemas/PageInfo"
    UserRole:
      $ref: "./openapi/common.yaml#/components/schemas/UserRole"

    RegisterRequest:
      $ref: "./openapi/user.yaml#/components/schemas/RegisterRequest"
    LoginRequest:
      $ref: "./openapi/user.yaml#/components/schemas/LoginRequest"
    UserPageQuery:
      $ref: "./openapi/user.yaml#/components/schemas/UserPageQuery"
    UserVO:
      $ref: "./openapi/user.yaml#/components/schemas/UserVO"
    PageUserVO:
      $ref: "./openapi/user.yaml#/components/schemas/PageUserVO"

    TopicCreateRequest:
      $ref: "./openapi/topic.yaml#/components/schemas/TopicCreateRequest"
    TopicPageQuery:
      $ref: "./openapi/topic.yaml#/components/schemas/TopicPageQuery"
    AdminTopicPageQuery:
      $ref: "./openapi/topic.yaml#/components/schemas/AdminTopicPageQuery"
    TopicVO:
      $ref: "./openapi/topic.yaml#/components/schemas/TopicVO"
    PageTopicVO:
      $ref: "./openapi/topic.yaml#/components/schemas/PageTopicVO"

    TagCreateRequest:
      $ref: "./openapi/tag.yaml#/components/schemas/TagCreateRequest"
    TagVO:
      $ref: "./openapi/tag.yaml#/components/schemas/TagVO"

    ReplyCreateRequest:
      $ref: "./openapi/reply.yaml#/components/schemas/ReplyCreateRequest"
    ReplyTopPageQuery:
      $ref: "./openapi/reply.yaml#/components/schemas/ReplyTopPageQuery"
    ReplyChildPageQuery:
      $ref: "./openapi/reply.yaml#/components/schemas/ReplyChildPageQuery"
    ReplyVO:
      $ref: "./openapi/reply.yaml#/components/schemas/ReplyVO"
    PageReplyVO:
      $ref: "./openapi/reply.yaml#/components/schemas/PageReplyVO"

    AttachmentVO:
      $ref: "./openapi/attachment.yaml#/components/schemas/AttachmentVO"

    CategoryCreateRequest:
      $ref: "./openapi/category.yaml#/components/schemas/CategoryCreateRequest"
    CategoryVO:
      $ref: "./openapi/category.yaml#/components/schemas/CategoryVO"
    CategoryTreeVO:
      $ref: "./openapi/category.yaml#/components/schemas/CategoryTreeVO"

tags:
  - name: User
    description: 用户管理（注册、登录、信息更新）
  - name: Topic
    description: 话题管理（CRUD、分页、状态）
  - name: Tag
    description: 标签管理（CRUD、搜索）
  - name: Reply
    description: 回复管理（新增、删除、分页查询）
  - name: Attachment
    description: 附件管理（在线预览、下载）
  - name: Health
    description: 健康检查
  - name: Category
    description: 分类管理（CRUD、树形查询、搜索）